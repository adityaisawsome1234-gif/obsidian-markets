<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b0f;
      color: #ececef;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .logo { width: 20px; height: 20px; background: linear-gradient(135deg, #a78bfa, #8b5cf6); border-radius: 5px; }
    .brand { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }
    .badge { font-size: 8px; font-weight: 700; color: #a78bfa; background: rgba(167,139,250,0.1); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(167,139,250,0.2); text-transform: uppercase; letter-spacing: 0.3px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 95%; padding: 10px 12px; border-radius: 10px;
      font-size: 12px; line-height: 1.65; word-break: break-word;
    }
    .msg-user {
      align-self: flex-end; background: #1c1c22; color: #ececef;
      border-bottom-right-radius: 3px;
    }
    .msg-ai {
      align-self: flex-start; background: #101014; color: #b0b0b8;
      border: 1px solid rgba(255,255,255,0.04); border-bottom-left-radius: 3px;
    }
    .msg-ai strong, .msg-ai b { color: #ececef; }
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px; color: #55555d;
    }
    .empty-state .icon { font-size: 28px; opacity: 0.3; }
    .empty-state p { font-size: 12px; text-align: center; max-width: 240px; line-height: 1.6; }
    .input-wrap {
      padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; gap: 8px; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; padding: 10px 12px; background: #16161b;
      border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
      color: #ececef; font-size: 12px; outline: none; font-family: inherit;
      resize: none; min-height: 40px; max-height: 120px;
    }
    .chat-input:focus { border-color: rgba(167,139,250,0.4); }
    .chat-input::placeholder { color: #3b3b42; }
    .send-btn {
      padding: 8px 14px; background: #8b5cf6; color: white;
      border: none; border-radius: 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: background 0.15s; align-self: flex-end;
    }
    .send-btn:hover { background: #7c3aed; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .typing { color: #55555d; font-size: 11px; padding: 4px 0; }
    .typing::after {
      content: '...'; animation: dots 1.5s steps(3) infinite;
    }
    @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    .disclaimer {
      font-size: 9px; color: #2a2a30; text-align: center; padding: 4px 12px 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <span class="brand">Obsidian AI</span>
    <span class="badge">Claude Sonnet 4</span>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty">
      <div class="icon">✦</div>
      <p>Ask about any stock, sector, or strategy. I have access to real-time market data.</p>
    </div>
  </div>

  <div class="input-wrap">
    <textarea class="chat-input" id="input" placeholder="Ask about any stock..." rows="1"></textarea>
    <button class="send-btn" id="send">Send</button>
  </div>

  <div class="disclaimer">AI analysis for informational purposes only. Not investment advice.</div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
